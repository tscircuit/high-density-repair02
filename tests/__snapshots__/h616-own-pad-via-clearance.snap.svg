"430.15860735009664" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.868157894736839" data-y="15.629255319148935" cx="285.6497607655497" cy="435.3578336557057" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.868157894736839" data-y="15.616489361702126" cx="285.6497607655497" cy="440.55705996131474" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.868157894736839" data-y="15.603723404255318" cx="285.6497607655497" cy="445.7562862669238" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.868157894736839" data-y="15.590957446808508" cx="285.6497607655497" cy="450.95551257253373" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.868157894736839" data-y="15.5781914893617" cx="285.6497607655497" cy="456.1547388781428" r="3" fill="#0ea5e9"/></g><g><circle data-type="point" data-label="" data-x="6.8649999999999975" data-y="15.574999999999998" cx="284.36363636363603" cy="457.45454545454504" r="3" fill="#0ea5e9"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":407.2727272727257,"c":0,"e":-2511.563636363625,"b":0,"d":-407.2727272727257,"f":6800.7272727272475};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>